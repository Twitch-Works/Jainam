project_id = "jainam"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "jainam://"
additional_redirect_urls = ["jainam://", "exp://127.0.0.1:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Dev convenience: skip the email-confirmation click. Turn ON for production.
enable_confirmations = false
secure_password_change = false

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your Jainam code is {{ .Code }}"

# Local dev: fixed OTP for these numbers so phone signup/login works without
# a real SMS provider. Configure Twilio (or similar) for staging/production.
[auth.sms.test_otp]
"+15555550100" = "123456"
"+919999900000" = "123456"

[analytics]
enabled = false
